<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients for Outer Rim & Seams -->
    <linearGradient id="goldRimDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE196" />
      <stop offset="30%" stop-color="#E5BE57" />
      <stop offset="70%" stop-color="#C9982E" />
      <stop offset="100%" stop-color="#EAC466" />
    </linearGradient>

    <!-- Rich Roasted Espresso Facet Gradients -->
    <linearGradient id="espressoFacetDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2115" />
      <stop offset="50%" stop-color="#28150D" />
      <stop offset="100%" stop-color="#140702" />
    </linearGradient>

    <linearGradient id="espressoFacetMid2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2A1B" />
      <stop offset="100%" stop-color="#2E170E" />
    </linearGradient>

    <!-- Cream Accent Facet Gradients -->
    <linearGradient id="creamFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#F2E6D4" />
      <stop offset="100%" stop-color="#DCCBB2" />
    </linearGradient>

    <!-- Oval Bean Silhouette Clip Path -->
    <clipPath id="ovalBeanClipDark">
      <ellipse cx="210" cy="220" rx="98" ry="132" />
    </clipPath>

    <!-- Glow for Dark Background -->
    <filter id="markGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. LEFT EMBLEM: SOCCER BALL + COFFEE BEAN EMBLEM         -->
  <!-- ======================================================== -->
  <g id="emblem-group-dark" filter="url(#markGlowDark)">
    <image href="/assets/aistudio/hattrick_emblem_cropped.png" x="85" y="95" width="250" height="250" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. RIGHT TYPOGRAPHY LOCKUP (MATCHING REFERENCE FORMAT)   -->
  <!-- ======================================================== -->
  <g id="typography-group-dark">
    
    <!-- ROW 1: "HATTRICK CAFE" (Clean Bold Sans-Serif Uppercase) -->
    <text x="355" 
          y="200" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.05em" 
          fill="#FFFDF9">
      HATTRICK CAFE
    </text>

    <!-- ROW 2: AMHARIC SCRIPT "ሃትሪክ ቡና" -->
    <text x="355" 
          y="272" 
          font-family="'Noto Sans Ethiopic', 'Nyala', 'Abyssinica SIL', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="0.06em" 
          fill="url(#goldRimDark)">
      ሃትሪክ ቡና
    </text>

    <!-- ROW 2 (ADJACENT): "HAWASSA, ETHIOPIA" -->
    <text x="690" 
          y="266" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="21" 
          font-weight="700" 
          letter-spacing="0.14em" 
          fill="#D4AF37">
      HAWASSA, ETHIOPIA
    </text>
  </g>
</svg>
