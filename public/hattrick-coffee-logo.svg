<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients for Outer Rim & Seams -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C887" />
      <stop offset="30%" stop-color="#C5A15B" />
      <stop offset="70%" stop-color="#9C7938" />
      <stop offset="100%" stop-color="#CBA965" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E6B8" />
      <stop offset="100%" stop-color="#A48039" />
    </linearGradient>

    <!-- Rich Roasted Espresso Facet Gradients -->
    <linearGradient id="espressoFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2115" />
      <stop offset="50%" stop-color="#28150D" />
      <stop offset="100%" stop-color="#190B05" />
    </linearGradient>

    <linearGradient id="espressoFacetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46291C" />
      <stop offset="100%" stop-color="#2D180F" />
    </linearGradient>

    <!-- Cream Accent Facet Gradients -->
    <linearGradient id="creamFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#F2E6D4" />
      <stop offset="100%" stop-color="#DCCBB2" />
    </linearGradient>

    <!-- Oval Bean Silhouette Clip Path -->
    <clipPath id="ovalBeanClip">
      <ellipse cx="210" cy="220" rx="98" ry="132" />
    </clipPath>

    <!-- Subtle Drop Shadow for Luxury Depth -->
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. LEFT EMBLEM: SOCCER BALL + COFFEE BEAN EMBLEM         -->
  <!-- ======================================================== -->
  <g id="emblem-group" filter="url(#markShadow)">
    <image href="/assets/aistudio/hattrick_emblem_cropped.png" x="85" y="95" width="250" height="250" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ======================================================== -->
  <!-- 2. RIGHT TYPOGRAPHY LOCKUP (MATCHING REFERENCE FORMAT)   -->
  <!-- ======================================================== -->
  <g id="typography-group">
    
    <!-- ROW 1: "HATTRICK CAFE" (Clean Bold Sans-Serif Uppercase) -->
    <text x="355" 
          y="200" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.05em" 
          fill="#2C170E">
      HATTRICK CAFE
    </text>

    <!-- ROW 2: AMHARIC SCRIPT "ሃትሪክ ቡና" -->
    <text x="355" 
          y="272" 
          font-family="'Noto Sans Ethiopic', 'Nyala', 'Abyssinica SIL', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="0.06em" 
          fill="#2C170E">
      ሃትሪክ ቡና
    </text>

    <!-- ROW 2 (ADJACENT): "HAWASSA, ETHIOPIA" -->
    <text x="690" 
          y="266" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="21" 
          font-weight="700" 
          letter-spacing="0.14em" 
          fill="#2C170E">
      HAWASSA, ETHIOPIA
    </text>
  </g>
</svg>
